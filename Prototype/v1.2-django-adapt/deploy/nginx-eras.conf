# Nginx reverse proxy for ERAS (TLS termination in front of Gunicorn).
#
# Installation:
#   sudo cp deploy/nginx-eras.conf /etc/nginx/sites-available/eras
#   sudo ln -s /etc/nginx/sites-available/eras /etc/nginx/sites-enabled/eras
#   sudo nginx -t && sudo systemctl reload nginx
#
# Static files are served by Django/WhiteNoise, so no /static/ block is needed.
# If the hospital IT uses its own proxy/load balancer instead of Nginx, the same
# rules apply: TLS, X-Forwarded-Proto/-For/Host, upload limit, admin restriction.

# ANPASSEN (Hosting): Hostname der Spital-IT, z. B. eras.ksw.ch
server {
    listen 80;
    listen [::]:80;
    server_name eras.example.ch;

    # Allow plain-HTTP health probes; everything else goes to HTTPS.
    location = /api/health/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name eras.example.ch;

    # ANPASSEN (Hosting): Zertifikat der Spital-IT (oder Let's Encrypt via certbot).
    ssl_certificate     /etc/ssl/certs/eras.example.ch.crt;
    ssl_certificate_key /etc/ssl/private/eras.example.ch.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Must be >= LAB_IMPORT_MAX_BYTES (10 MB) plus multipart overhead.
    client_max_body_size 12m;

    # Must be > Gunicorn timeout because lab OCR runs synchronously.
    proxy_read_timeout 120s;

    server_tokens off;

    # ANPASSEN (Hosting): Pfad = DJANGO_ADMIN_URL; IP-Bereiche = Spitalnetz/VPN.
    location /backoffice-change-me/ {
        allow 10.0.0.0/8;
        deny all;
        include /etc/nginx/snippets/eras-proxy.conf;
    }

    location / {
        include /etc/nginx/snippets/eras-proxy.conf;
    }
}

# Contents of /etc/nginx/snippets/eras-proxy.conf:
#
#   proxy_pass http://127.0.0.1:8000;
#   proxy_set_header Host $host;
#   proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
#   # Overwrites any client-supplied value – required for SECURE_PROXY_SSL_HEADER.
#   proxy_set_header X-Forwarded-Proto $scheme;
#   proxy_redirect off;
